<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4C6FFF">
<title>辅导员工作台 · Counselor Workbench</title>
<!-- 本工作台为单文件HTML，数据存储在浏览器localStorage，支持JSON导入导出备份 -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;color:#1f2937;background:#f5f7fa;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.modal-open{overflow:hidden}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:#1f2937}
a{color:#4C6FFF;text-decoration:none}
ul{list-style:none}

/* ===== 布局 ===== */
.layout{display:flex;min-height:100vh}
.sidebar{width:224px;background:#fff;border-right:1px solid #eef0f4;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;transition:transform .25s ease}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
.brand{padding:18px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eef0f4;position:sticky;top:0;background:#fff;z-index:10}
.brand-logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#4C6FFF,#6366F1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(76,111,255,.3)}
.brand-text h1{font-size:14px;font-weight:600;color:#111827;line-height:1.2}
.brand-text p{font-size:11px;color:#6b7280;margin-top:2px}
.nav{padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#4b5563;font-size:13.5px;cursor:pointer;margin-bottom:2px;transition:all .15s}
.nav-item:hover{background:#f3f6fb;color:#1f2937}
.nav-item.active{background:linear-gradient(95deg,#eef1ff,#f5f7ff);color:#4C6FFF;font-weight:600}
.nav-item .ico{width:18px;height:18px;flex-shrink:0;color:#6b7280}
.nav-item.active .ico{color:#4C6FFF}
.nav-item .badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600;min-width:18px;text-align:center}
.nav-sep{font-size:10.5px;color:#9ca3af;padding:10px 14px 4px;letter-spacing:1px}

.main{flex:1;margin-left:224px;min-width:0}
.topbar{background:#fff;padding:12px 24px;border-bottom:1px solid #eef0f4;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.topbar h2{font-size:17px;font-weight:600;color:#111827}
.topbar .crumb{font-size:12px;color:#6b7280;margin-top:1px}
.topbar .actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;background:#f3f6fb;color:#374151;font-size:12.5px;border-radius:6px;transition:all .15s;min-height:32px}
.tbtn:hover{background:#e8eef7}
.tbtn.primary{background:#4C6FFF;color:#fff}
.tbtn.primary:hover{background:#3d5ce5}
.tbtn svg{width:13px;height:13px}
.user{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#f3f6fb;border-radius:20px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#4C6FFF);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;overflow:hidden;flex-shrink:0;cursor:pointer}
.user-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.user-role{font-size:11px;background:#4C6FFF;color:#fff;padding:2px 6px;border-radius:4px;font-weight:500}
.user-name{font-size:13px;font-weight:500;color:#111827;cursor:pointer;position:relative}
.user-name:hover{color:#4C6FFF}
.user-name::after{content:'✎';font-size:10px;color:#9ca3af;margin-left:3px;opacity:.7}

.content{padding:18px 24px 90px;max-width:1440px;margin:0 auto}
.page{display:none}
.page.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== 卡片 ===== */
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #f1f3f7;flex-wrap:wrap;gap:8px}
.card-header h3{font-size:15px;font-weight:600;color:#111827;display:flex;align-items:center;gap:8px}
.card-header h3 svg{width:18px;height:18px;color:#4C6FFF}
.card-header .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat-card{background:#fff;border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.stat-icon svg{width:23px;height:23px}
.stat-icon.b1{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
.stat-icon.b2{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}
.stat-icon.b3{background:linear-gradient(135deg,#fb923c,#f97316)}
.stat-icon.b4{background:linear-gradient(135deg,#f472b6,#ec4899)}
.stat-icon.b5{background:linear-gradient(135deg,#34d399,#10b981)}
.stat-icon.b6{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.stat-icon.b7{background:linear-gradient(135deg,#f87171,#ef4444)}
.stat-info .v{font-size:23px;font-weight:700;color:#111827;line-height:1}
.stat-info .l{font-size:12px;color:#6b7280;margin-top:4px}
.stat-info .s{font-size:11px;color:#9ca3af;margin-top:4px}

.row{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:1100px){.row{grid-template-columns:1fr}}

/* ===== 待办 ===== */
.todo-list .todo-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;margin-bottom:8px;background:#fafbfc;transition:all .15s;flex-wrap:wrap}
.todo-item:hover{background:#f3f6fb}
.todo-item.overdue{background:#fff5f5;border-left:3px solid #ef4444}
.todo-item.done{opacity:.5;text-decoration:line-through}
.todo-check{width:20px;height:20px;border:2px solid #d1d5db;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.todo-check.checked{background:#10b981;border-color:#10b981;color:#fff}
.todo-content{flex:1;min-width:0}
.todo-content .title{font-size:13.5px;color:#1f2937;margin-bottom:2px}
.todo-content .meta{font-size:11px;color:#9ca3af}
.todo-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;flex-shrink:0}
.todo-tag.overdue{background:#fee2e2;color:#dc2626}
.todo-tag.today{background:#fef3c7;color:#d97706}
.todo-tag.tomorrow{background:#dbeafe;color:#2563eb}
.todo-tag.future{background:#f3f4f6;color:#4b5563}
.todo-tag.done{background:#d1fae5;color:#059669}
.todo-add{display:flex;gap:8px;margin-top:14px;padding:12px;background:#f9fafb;border-radius:8px;flex-wrap:wrap}
.todo-add input,.todo-add .date-input{padding:9px 12px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;outline:none}
.todo-add input[type=text]{flex:1;min-width:180px}
.todo-add .add-btn{padding:9px 20px;background:#0d9488;color:#fff;border-radius:6px;font-weight:500;transition:all .15s}
.todo-add .add-btn:hover{background:#0f766e}
.todo-add .date-input{width:150px;font-size:15px}

/* ===== 通知/生日 ===== */
.notice-item{padding:12px 0;border-bottom:1px solid #f3f4f6}
.notice-item:last-child{border-bottom:none}
.notice-item .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.notice-item .dot.blue{background:#3b82f6}
.notice-item .dot.red{background:#ef4444}
.notice-item .dot.orange{background:#f97316}
.notice-item .text{font-size:13px;color:#374151;line-height:1.5}
.notice-item .date{font-size:11px;color:#9ca3af;margin-top:4px;margin-left:18px}
.birthday-list .bd-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6}
.birthday-list .bd-item:last-child{border-bottom:none}
.bd-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.bd-info{flex:1}
.bd-info .name{font-size:13px;color:#1f2937;font-weight:500}
.bd-info .date{font-size:11px;color:#9ca3af;margin-top:2px}
.bd-due{font-size:11px;padding:2px 6px;border-radius:3px;font-weight:500}
.bd-due.soon{background:#fef3c7;color:#d97706}
.bd-due.today{background:#fee2e2;color:#dc2626}

/* ===== 考勤 ===== */
.attendance-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.att-item{background:#f9fafb;padding:13px 10px;border-radius:8px;text-align:center}
.att-item .num{font-size:26px;font-weight:700;color:#1f2937;line-height:1}
.att-item .lbl{font-size:12px;color:#6b7280;margin-top:5px}
.att-item.present .num{color:#10b981}
.att-item.late .num{color:#f59e0b}
.att-item.leave .num{color:#3b82f6}
.att-item.absent .num{color:#ef4444}

/* ===== 按钮 ===== */
.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .15s;border:1px solid transparent;min-height:36px}
.btn svg{width:14px;height:14px}
.btn.primary{background:#4C6FFF;color:#fff}
.btn.primary:hover{background:#3d5ce5}
.btn.danger{background:#ef4444;color:#fff}
.btn.danger:hover{background:#dc2626}
.btn.success{background:#10b981;color:#fff}
.btn.success:hover{background:#059669}
.btn.warn{background:#f59e0b;color:#fff}
.btn.warn:hover{background:#d97706}
.btn.ghost{background:#f3f6fb;color:#374151;border-color:#e5e7eb}
.btn.ghost:hover{background:#e8eef7}
.btn-sm{padding:5px 10px;font-size:12px;min-height:30px}
.btn-block{width:100%;justify-content:center}

/* ===== 表格 ===== */
.table-wrap{background:#fff;border-radius:8px;overflow-x:auto;border:1px solid #eef0f4}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f9fafb;color:#374151;font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid #eef0f4;font-size:12.5px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f3f4f6;color:#1f2937;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.tag.boy{background:#dbeafe;color:#2563eb}
.tag.girl{background:#fce7f3;color:#be185d}
.tag.green{background:#d1fae5;color:#059669}
.tag.red{background:#fee2e2;color:#dc2626}
.tag.orange{background:#fed7aa;color:#c2410c}
.tag.gray{background:#f3f4f6;color:#4b5563}
.tag.purple{background:#ede9fe;color:#7c3aed}
.tag.blue{background:#dbeafe;color:#2563eb}
.tag.pink{background:#fce7f3;color:#be185d}
.tag.teal{background:#ccfbf1;color:#0f766e}
.tag.indigo{background:#e0e7ff;color:#4338ca}
.dim-d{background:#fee2e2;color:#dc2626}
.dim-z{background:#dbeafe;color:#2563eb}
.dim-t{background:#d1fae5;color:#059669}
.dim-m{background:#fce7f3;color:#be185d}
.dim-l{background:#fed7aa;color:#c2410c}
.dim-custom{background:#64748b;color:#fff}

/* ===== 表单 ===== */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:#374151;font-weight:500;margin-bottom:6px}
.form-group label .req{color:#ef4444}
.form-input{width:100%;padding:9px 12px;border:1px solid #e5e7eb;border-radius:6px;outline:none;transition:all .15s;background:#fff}
.form-input:focus{border-color:#4C6FFF;box-shadow:0 0 0 3px rgba(76,111,255,.1)}
textarea.form-input{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}

/* ===== 模态框 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex;animation:fadeIn .15s ease}
.modal{background:#fff;border-radius:12px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-head{padding:16px 20px;border-bottom:1px solid #f1f3f7;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff}
.modal-head h3{font-size:16px;font-weight:600;color:#111827}
.modal-close{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#6b7280;cursor:pointer}
.modal-close:hover{background:#f3f4f6}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid #f1f3f7;display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}

/* ===== 工具 ===== */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:200px;padding:9px 12px;border:1px solid #e5e7eb;border-radius:6px;outline:none;background:#fff}
.toolbar .search:focus{border-color:#4C6FFF;box-shadow:0 0 0 3px rgba(76,111,255,.1)}
.toolbar select{padding:9px 12px;border:1px solid #e5e7eb;border-radius:6px;outline:none;background:#fff;font-size:15px}
.empty{text-align:center;padding:40px 20px;color:#9ca3af;font-size:13px}
.empty svg{width:40px;height:40px;margin-bottom:10px;color:#d1d5db}
.empty p{margin-bottom:6px}
.toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:fadeIn .2s ease;max-width:90vw}
.toast.ok{background:#059669}
.toast.error{background:#dc2626}
.toast.warn{background:#d97706}
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}
.drawer-mask.show{display:block}
.sb-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:none}
@media(max-width:768px){.sb-mask.show{display:block}}
.drawer{position:fixed;right:-280px;top:0;bottom:0;width:280px;background:#fff;z-index:210;transition:right .25s ease;box-shadow:-8px 0 30px rgba(0,0,0,.1);display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer-head{padding:16px 18px;border-bottom:1px solid #f1f3f7;display:flex;align-items:center;justify-content:space-between}
.drawer-body{padding:10px 12px;overflow-y:auto;flex:1}
.drawer-body .nav-item{padding:11px 12px;font-size:14px}
.ro-banner{background:linear-gradient(95deg,#fef3c7,#fffbeb);border-bottom:1px solid #fde68a;padding:9px 20px;font-size:12.5px;color:#92400e;display:flex;align-items:center;gap:8px;cursor:pointer}
.ro-banner svg{width:15px;height:15px}
.ro-mode .btn:not(.btn-allow),.ro-mode .todo-check,.ro-mode .add-btn,.ro-mode .tbtn:not(.btn-allow){pointer-events:none;opacity:.45}
.ro-mode input,.ro-mode select,.ro-mode textarea{pointer-events:none;opacity:.6}

/* ===== 班级切换标签 ===== */
.klass-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ktab{padding:8px 16px;border-radius:8px;background:#fff;border:1px solid #e5e7eb;color:#4b5563;font-size:13px;cursor:pointer;transition:all .15s;min-height:38px}
.ktab:hover{border-color:#4C6FFF;color:#4C6FFF}
.ktab.active{background:#4C6FFF;border-color:#4C6FFF;color:#fff;font-weight:600}
.ktab .n{font-size:11px;opacity:.75;margin-left:5px}

/* ===== 列表卡片 ===== */
.mini-list .mi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;margin-bottom:8px;background:#fafbfc;transition:all .15s;flex-wrap:wrap}
.mini-list .mi:hover{background:#f3f6fb}
.mi .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4C6FFF,#6366F1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.mi .avatar.warn{background:linear-gradient(135deg,#f87171,#ef4444)}
.mi .avatar.orange{background:linear-gradient(135deg,#fb923c,#f97316)}
.mi .avatar.green{background:linear-gradient(135deg,#34d399,#10b981)}
.mi .info{flex:1;min-width:0}
.mi .info .t{font-size:13.5px;color:#1f2937;font-weight:500}
.mi .info .s{font-size:11.5px;color:#9ca3af;margin-top:1px}
.mi .ops{display:flex;gap:6px;flex-shrink:0}

/* ===== 底部 Tab（移动端） ===== */
.bottom-tab{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eef0f4;z-index:150;padding-bottom:env(safe-area-inset-bottom)}
.bottom-tab .bt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:#6b7280;font-size:10.5px}
.bottom-tab .bt svg{width:21px;height:21px}
.bottom-tab .bt.active{color:#4C6FFF}
.hamburger{display:none;width:36px;height:36px;border-radius:8px;align-items:center;justify-content:center;color:#374151}
.hamburger:hover{background:#f3f6fb}

/* ===== 五育/测评 ===== */
.assess-total{font-size:18px;font-weight:700;color:#111827}
.assess-total.pos{color:#059669}
.assess-total.neg{color:#dc2626}
.rank-num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#f3f4f6;color:#4b5563;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.rank-num.top1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.rank-num.top2{background:linear-gradient(135deg,#d1d5db,#9ca3af);color:#fff}
.rank-num.top3{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff}

/* ===== 学生搜索选择器 ===== */
.fc-opt{padding:11px 14px;border-radius:6px;background:#fafbfc;cursor:pointer;font-size:13px;color:#1f2937;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.fc-opt:hover{background:#eef1ff;color:#4C6FFF}

/* ===== 课程表 ===== */
.schedule-grid{display:grid;grid-template-columns:76px repeat(5,minmax(110px,1fr));gap:1px;background:#eef0f4;border-radius:8px;overflow:hidden;border:1px solid #eef0f4;font-size:12px;min-width:620px}
.schedule-grid > div{padding:8px;background:#fff;text-align:center;min-height:64px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.schedule-grid .head{background:#f9fafb;font-weight:600;color:#374151;min-height:auto;padding:10px 6px}
.schedule-grid .head.today-col{background:#eef1ff;color:#4C6FFF}
.schedule-grid .time{background:#f3f6fb;color:#374151;cursor:pointer;min-height:64px}
.schedule-grid .time:hover{background:#e8eef7}
.schedule-grid .period-cell.today-col{background:#f7f9ff}
.subject-chip{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;background:#6366F1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subject-meta{font-size:10.5px;color:#9ca3af;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj-高等数学{background:#4C6FFF}.subj-大学英语{background:#8b5cf6}.subj-程序设计基础{background:#0ea5e9}.subj-线性代数{background:#10b981}.subj-数据结构{background:#f59e0b}.subj-离散数学{background:#ec4899}.subj-大学物理{background:#6366f1}.subj-体育{background:#22c55e}.subj-形势与政策{background:#ef4444}.subj-思想道德与法治{background:#a855f7}.subj-专业导论{background:#14b8a6}.subj-心理健康{background:#f472b6}.subj-自习{background:#9ca3af}.subj-班会{background:#f97316}.subj-实践{background:#84cc16}
.schedule-scroll{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}

/* ===== 响应式 ===== */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .hamburger{display:flex}
  .bottom-tab{display:flex}
  .content{padding:14px 14px 84px}
  .topbar{padding:10px 14px}
  .topbar h2{font-size:15px}
  .crumb{display:none}
  .user-name{display:none}
  .stat-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .attendance-grid{grid-template-columns:repeat(2,1fr)}
  .drawer-body .nav-item{min-height:44px;padding:12px 14px}
  .ktab{min-height:40px;white-space:nowrap;flex-shrink:0}
}
@media(max-width:600px){
  table{font-size:12px}
  th,td{padding:9px 8px}
  .modal-mask{padding:0;align-items:flex-end}
  .modal{border-radius:14px 14px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom)}
  .modal-head{padding:14px 16px}
  .modal-body{padding:16px}
  .modal-foot{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .toolbar select{flex:1}
  .toolbar .search{flex:100%;min-width:100%;order:-1;font-size:16px}
  #attSearch{width:100%!important;min-width:100%!important;font-size:16px;order:-1}
  .card-header .actions{flex-wrap:wrap}
  .klass-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-right:-14px}
  .ktab{margin-right:2px}
  .mi .ops{flex-wrap:wrap;gap:8px}
  .btn{min-height:44px}
  .tbtn{min-height:40px}
  .todo-add .date-input{width:100%}
  .stat-card{padding:13px 14px}
  .toast-wrap{top:auto;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%)}
}
</style>
